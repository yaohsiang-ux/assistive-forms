<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>輔具報告填寫器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#D65A31">
<meta name="apple-mobile-web-app-title" content="輔具填寫">
<style>
:root{
  --orange:#D65A31; --gold:#E6AF2E; --brown:#4B3621; --cream:#FAF6F0;
  --bg:#ffffff; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --card:#ffffff;
  --chip:#f5f5f4; --ok:#15803d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1917;--fg:#fafaf9;--muted:#a8a29e;--line:#44403c;--card:#292524;--chip:#3a3532;--cream:#292524}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}

/* ── 頂部 ── */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.hrow{display:flex;align-items:center;gap:8px}
.title{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:6px;margin-top:8px}
.tools input,.tools select{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
.tools select{flex:0 0 42%}

/* ── 起始畫面 ── */
#start{padding:28px 18px;max-width:640px;margin:0 auto}
#start h1{font-size:20px;margin:0 0 4px}
#start p{color:var(--muted);font-size:14px;margin:0 0 20px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:30px 18px;text-align:center;background:var(--cream)}
.big{display:inline-block;background:var(--orange);color:#fff;border:0;border-radius:12px;
  padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer}
.big{-webkit-user-select:none;user-select:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.alt{margin-top:16px;font-size:13px;color:var(--muted)}
.alt input{display:block;margin-top:7px;width:100%}
.ver{margin-top:18px;font-size:11px;color:var(--muted);text-align:center}
.hint{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.7;text-align:left}
.hint b{color:var(--fg)}

/* ── 題目卡片 ── */
main{padding:10px 12px 96px;max-width:760px;margin:0 auto}
.sec{margin:22px 0 8px;font-weight:700;color:var(--orange);font-size:15px;
  border-left:4px solid var(--gold);padding-left:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:10px 12px;margin:7px 0}
.q{font-size:14px;margin-bottom:7px;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.q .num{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;
  padding:9px 14px;font-size:14.5px;cursor:pointer;user-select:none;line-height:1.2}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.chip .bx{margin-right:5px;opacity:.65}
.chip.on .bx{opacity:1}
.fld{display:block;width:100%;margin:5px 0 0;padding:8px 10px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);resize:none;overflow:hidden;
  min-height:40px;height:40px;line-height:1.5}
.fld.filled{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 6%,var(--bg))}
.flab{font-size:12px;color:var(--muted);margin:8px 0 0}
.flab[hidden]{display:none}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* ── 底部 ── */
footer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);
  border-top:1px solid var(--line);padding:9px 12px calc(env(safe-area-inset-bottom) + 9px);
  display:flex;gap:8px;align-items:center}
footer .st{flex:1;font-size:12px;color:var(--muted);line-height:1.35}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 15px;
  font-weight:600;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
header[hidden],footer[hidden]{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:40;
  background:var(--brown);color:#fff;padding:11px 17px;border-radius:11px;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:.96}
.err{background:#7f1d1d}
</style>
</head>
<body>

<div id="start">
  <h1>輔具報告填寫器</h1>
  <p>開啟已灌好基本資料的報告書，現場填完直接存回 Word 檔。</p>
  <div class="drop">
    <label class="big" for="file">選擇報告書（.docx）</label>
    <input type="file" id="file" class="vh"
           accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
    <div class="alt">按了沒反應的話用這個：<input type="file" id="file2"
           accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></div>
    <div class="hint">
      <b>怎麼用</b><br>
      1. 出門前在 Mac 灌好基本資料，把 .docx 存到手機「檔案」App<br>
      2. 這裡選那個檔 → 逐題點選、填字<br>
      3. 按「匯出 Word」存回「檔案」App<br>
      4. 回家自己轉 PDF<br><br>
      全程離線，不需要帳號，檔案不會離開這支手機。
    </div>
    <div class="ver" id="ver">v2</div>
  </div>
</div>

<header id="bar" hidden>
  <div class="hrow">
    <div class="title" id="fname">—</div>
    <div class="badge" id="count">—</div>
  </div>
  <div class="tools">
    <select id="jump"><option value="">跳到章節…</option></select>
    <input id="search" type="search" placeholder="搜尋題目…" autocomplete="off">
  </div>
</header>

<main id="app"></main>

<footer id="foot" hidden>
  <div class="st" id="status">—</div>
  <button class="btn" id="reset">清空</button>
  <button class="btn pri" id="export">匯出 Word</button>
</footer>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   輔具報告填寫器
   讀 .docx → 把裡面的核取方塊與填空格攤成手機表單 → 填完寫回 .docx
   不綁模板：官方模板改版、換編號都不用改這支程式。
   ══════════════════════════════════════════════════════════ */

const NS_W   = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
const NS_W14 = "http://schemas.microsoft.com/office/word/2010/wordml";
const BOXES  = "□☐";              // □ ☐  未勾
const TICKS  = "■☑☒✅";  // ■ ☑ ☒  已勾

/* ── ZIP：只換掉 document.xml，其餘原封不動搬過去 ───────── */
const CRC_T = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; } return t; })();
function crc32(buf) { let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; }

async function inflateRaw(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  const ab = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(ab);
}
async function deflateRaw(bytes) {
  if (typeof CompressionStream === "undefined") return null;
  const cs = new CompressionStream("deflate-raw");
  const ab = await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer();
  return new Uint8Array(ab);
}

function readZip(ab) {
  const u8 = new Uint8Array(ab), dv = new DataView(ab);
  let eo = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 65558; i--)
    if (dv.getUint32(i, true) === 0x06054b50) { eo = i; break; }
  if (eo < 0) throw new Error("不是有效的 .docx（找不到壓縮檔結尾）");
  const n = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);
  const entries = [];
  for (let i = 0; i < n; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("壓縮檔目錄損毀");
    const method = dv.getUint16(p + 10, true), time = dv.getUint16(p + 12, true),
          date = dv.getUint16(p + 14, true), crc = dv.getUint32(p + 16, true),
          csize = dv.getUint32(p + 20, true), usize = dv.getUint32(p + 24, true),
          nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true),
          clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    const lnl = dv.getUint16(lho + 26, true), lel = dv.getUint16(lho + 28, true);
    const dstart = lho + 30 + lnl + lel;
    entries.push({ name, method, time, date, crc, usize,
                   raw: u8.subarray(dstart, dstart + csize) });
    p += 46 + nlen + elen + clen;
  }
  return entries;
}

async function writeZip(entries) {
  const enc = new TextEncoder(), parts = [], dir = [];
  let off = 0;
  for (const e of entries) {
    const nb = enc.encode(e.name);
    const lh = new Uint8Array(30 + nb.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0, true);
    lv.setUint16(8, e.method, true); lv.setUint16(10, e.time, true); lv.setUint16(12, e.date, true);
    lv.setUint32(14, e.crc, true); lv.setUint32(18, e.raw.length, true);
    lv.setUint32(22, e.usize, true); lv.setUint16(26, nb.length, true); lv.setUint16(28, 0, true);
    lh.set(nb, 30);
    parts.push(lh, e.raw);
    const ch = new Uint8Array(46 + nb.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, e.method, true);
    cv.setUint16(12, e.time, true); cv.setUint16(14, e.date, true);
    cv.setUint32(16, e.crc, true); cv.setUint32(20, e.raw.length, true);
    cv.setUint32(24, e.usize, true); cv.setUint16(28, nb.length, true);
    cv.setUint32(42, off, true); ch.set(nb, 46);
    dir.push(ch);
    off += lh.length + e.raw.length;
  }
  let dlen = 0; for (const d of dir) dlen += d.length;
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, dir.length, true);
  ev.setUint16(10, dir.length, true); ev.setUint32(12, dlen, true); ev.setUint32(16, off, true);
  return new Blob([...parts, ...dir, eo],
    { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

/* ── 從 document.xml 抽出所有欄位 ─────────────────────────
   規則（已對 10 份官方模板驗證）：
   · 核取方塊 = w14:checkbox 控制項，或內文裡的純文字 □
   · 選項名稱 = 方框「後面」緊接的文字
   · 填空格   = 文字內容控制項，或標籤後面的空白 run
   ──────────────────────────────────────────────────────── */
function parseDoc(xmlDoc) {
  const body = xmlDoc.getElementsByTagNameNS(NS_W, "body")[0];
  if (!body) throw new Error("這個檔案不是 Word 文件內容");
  const paras = body.getElementsByTagNameNS(NS_W, "p");
  const fields = [], blocks = [];

  for (let pi = 0; pi < paras.length; pi++) {
    const toks = tokenize(paras[pi]);
    if (!toks.length) continue;
    const items = [], text = [];

    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (t.k === "cb") {
        items.push({ type: "cb", sdt: t.el, label: labelAfter(toks, i) });
        text.push("□");
      } else if (t.k === "fld") {
        items.push({ type: "txt", sdt: t.el, label: labelBefore(toks, i) });
        text.push("＿");
      } else {
        const s = t.el.textContent || "";
        // 純文字方框：一個 □ 就是一個選項
        if ([...s].some(c => BOXES.includes(c) || TICKS.includes(c))) {
          const segs = splitBoxes(s);
          segs.forEach((seg, k) => {
            if (seg.box) items.push({ type: "cb", node: t.el, charIdx: seg.at, label: seg.label });
            text.push(seg.box ? "□" + seg.label : seg.label);
          });
        } else {
          text.push(s);
          // 標籤後的空白 run 也是可填的格子（舊式模板）
          if (!s.trim() && s.length >= 4 && text.join("").trim())
            items.push({ type: "txt", node: t.el, label: labelBeforeText(text) });
        }
      }
    }
    const full = text.join("").trim();
    if (!items.length) { if (full) blocks.push({ kind: "head", text: full }); continue; }
    const blk = { kind: "q", text: full, items: [] };
    for (const it of items) { it.idx = fields.length; fields.push(it); blk.items.push(it); }
    blocks.push(blk);
  }
  return { fields, blocks };
}

function tokenize(p) {
  const out = [];
  (function walk(node) {
    for (let c = node.firstElementChild; c; c = c.nextElementSibling) {
      if (c.namespaceURI === NS_W && c.localName === "sdt") {
        const pr = c.getElementsByTagNameNS(NS_W, "sdtPr")[0];
        const cb = pr && pr.getElementsByTagNameNS(NS_W14, "checkbox")[0];
        out.push({ k: cb ? "cb" : "fld", el: c });
      } else if (c.namespaceURI === NS_W && c.localName === "t") {
        out.push({ k: "t", el: c });
      } else walk(c);
    }
  })(p);
  return out;
}

function splitBoxes(s) {
  const segs = []; let cur = "", curAt = -1, started = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (BOXES.includes(ch) || TICKS.includes(ch)) {
      if (started) segs.push({ box: true, at: curAt, label: cur.trim() });
      else if (cur.trim()) segs.push({ box: false, label: cur });
      cur = ""; curAt = i; started = true;
    } else cur += ch;
  }
  if (started) segs.push({ box: true, at: curAt, label: cur.trim() });
  else if (cur) segs.push({ box: false, label: cur });
  return segs;
}

function labelAfter(toks, i) {
  let out = "";
  for (let k = i + 1; k < toks.length && out.length < 30; k++) {
    if (toks[k].k !== "t") break;
    out += toks[k].el.textContent || "";
  }
  out = out.replace(/^[\s　]+/, "");
  const cut = out.search(/[\s　]{2,}/);
  return (cut > 0 ? out.slice(0, cut) : out).trim() || "（未命名）";
}
function labelBefore(toks, i) {
  let out = "";
  for (let k = i - 1; k >= 0 && out.length < 40; k--) {
    if (toks[k].k !== "t") break;
    out = (toks[k].el.textContent || "") + out;
  }
  return tailLabel(out);
}
function labelBeforeText(text) { return tailLabel(text.join("")); }
function tailLabel(s) {
  s = s.replace(/[\s　]+$/, "");
  const m = s.match(/([^\s　：:）)]{1,14}[：:]?)$/);
  return (m ? m[1] : s.slice(-14)).trim() || "填寫";
}
</script>

<script>
"use strict";
/* ── 寫回 docx ───────────────────────────────────────────── */
function cbChar(sdt, on) {
  const cb = sdt.getElementsByTagNameNS(NS_W14, "checkbox")[0];
  const st = cb && cb.getElementsByTagNameNS(NS_W14, on ? "checkedState" : "uncheckedState")[0];
  const v = st && st.getAttributeNS(NS_W14, "val");
  if (v) { try { return String.fromCodePoint(parseInt(v, 16)); } catch (e) {} }
  return on ? "■" : "□";
}
function setCheckbox(f, on) {
  if (f.sdt) {
    // 控制項：狀態與顯示字元一定要一起改，只改一個 Word 會不一致
    const cb = f.sdt.getElementsByTagNameNS(NS_W14, "checkbox")[0];
    const chk = cb && cb.getElementsByTagNameNS(NS_W14, "checked")[0];
    if (chk) chk.setAttributeNS(NS_W14, "w14:val", on ? "1" : "0");
    const ch = cbChar(f.sdt, on);
    const cont = f.sdt.getElementsByTagNameNS(NS_W, "sdtContent")[0];
    const ts = cont ? cont.getElementsByTagNameNS(NS_W, "t") : [];
    for (let i = 0; i < ts.length; i++) ts[i].textContent = i === 0 ? ch : "";
  } else if (f.node) {
    const s = f.node.textContent || "";
    const ch = on ? "☑" : "□";
    f.node.textContent = s.slice(0, f.charIdx) + ch + s.slice(f.charIdx + 1);
  }
}
function setText(f, val) {
  if (f.sdt) {
    const pr = f.sdt.getElementsByTagNameNS(NS_W, "sdtPr")[0];
    if (pr) { const plc = pr.getElementsByTagNameNS(NS_W, "showingPlcHdr")[0];
              if (plc) plc.parentNode.removeChild(plc); }
    const cont = f.sdt.getElementsByTagNameNS(NS_W, "sdtContent")[0];
    if (!cont) return;
    const ts = cont.getElementsByTagNameNS(NS_W, "t");
    if (ts.length) { for (let i = 0; i < ts.length; i++) {
        ts[i].textContent = i === 0 ? val : "";
        ts[i].setAttribute("xml:space", "preserve"); } return; }
    // 空殼控制項：自己造 run，字型沿用 sdtEndPr
    const doc = f.sdt.ownerDocument;
    let r = cont.getElementsByTagNameNS(NS_W, "r")[0];
    if (!r) { r = doc.createElementNS(NS_W, "w:r");
      const end = f.sdt.getElementsByTagNameNS(NS_W, "sdtEndPr")[0];
      const rpr = end && end.getElementsByTagNameNS(NS_W, "rPr")[0];
      if (rpr) r.appendChild(rpr.cloneNode(true));
      cont.appendChild(r); }
    const t = doc.createElementNS(NS_W, "w:t");
    t.setAttribute("xml:space", "preserve"); t.textContent = val; r.appendChild(t);
  } else if (f.node) {
    f.node.textContent = val;
    f.node.setAttribute("xml:space", "preserve");
  }
}

/* ── 狀態 ─────────────────────────────────────────────────── */
const S = { entries: null, xmlDoc: null, docEntry: null, model: null,
            values: {}, fname: "", key: "" };
const $ = id => document.getElementById(id);
let toastT = null;
function toast(msg, bad) {
  const el = $("toast"); el.textContent = msg;
  el.className = "toast show" + (bad ? " err" : "");
  clearTimeout(toastT); toastT = setTimeout(() => el.className = "toast", 2400);
}

/* ── 載入 ─────────────────────────────────────────────────── */
for (const id of ["file", "file2"]) {
  const el = $(id);
  if (el) el.addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (f) load(f);
  });
}

async function load(file) {
  try {
    const ab = await file.arrayBuffer();
    const entries = readZip(ab);
    const de = entries.find(x => x.name === "word/document.xml");
    if (!de) throw new Error("這個 .docx 裡沒有內容檔，可能不是 Word 文件");
    const raw = de.method === 8 ? await inflateRaw(de.raw) : de.raw;
    const xml = new TextDecoder("utf-8").decode(raw);
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    if (doc.getElementsByTagName("parsererror").length) throw new Error("Word 內容解析失敗");
    const model = parseDoc(doc);
    if (!model.fields.length) throw new Error("這份文件裡找不到可勾選或可填寫的欄位");

    S.entries = entries; S.xmlDoc = doc; S.docEntry = de; S.model = model;
    S.fname = file.name; S.key = "af:" + file.name + ":" + raw.length;
    S.values = {};
    try { const saved = localStorage.getItem(S.key);
          if (saved) { S.values = JSON.parse(saved);
            toast("已回復上次填到一半的內容"); } } catch (e) {}
    // 讀回文件裡本來就已經勾好/填好的（例如 Mac 灌好的基本資料）
    model.fields.forEach(f => {
      if (S.values[f.idx] !== undefined) return;
      if (f.type === "cb") {
        let on = false;
        if (f.sdt) { const cb = f.sdt.getElementsByTagNameNS(NS_W14, "checkbox")[0];
          const chk = cb && cb.getElementsByTagNameNS(NS_W14, "checked")[0];
          on = !!chk && chk.getAttributeNS(NS_W14, "val") === "1"; }
        else if (f.node) { const c = (f.node.textContent || "")[f.charIdx]; on = TICKS.includes(c); }
        if (on) S.values[f.idx] = true;
      } else {
        let v = "";
        if (f.sdt) { const pr = f.sdt.getElementsByTagNameNS(NS_W, "sdtPr")[0];
          const plc = pr && pr.getElementsByTagNameNS(NS_W, "showingPlcHdr")[0];
          const cont = f.sdt.getElementsByTagNameNS(NS_W, "sdtContent")[0];
          if (!plc && cont) v = (cont.textContent || "").trim(); }
        if (v) S.values[f.idx] = v;
      }
    });
    $("start").hidden = true; $("bar").hidden = false; $("foot").hidden = false;
    $("fname").textContent = file.name.replace(/\.docx$/i, "");
    render();
  } catch (err) { toast(err.message || String(err), true); }
}

/* ── 畫面 ─────────────────────────────────────────────────── */
function isSection(t) {
  return /^[一二三四五六七八九十]+[、．.]/.test(t) || /^【.+】$/.test(t);
}
function render() {
  const app = $("app"), jump = $("jump");
  app.innerHTML = ""; jump.innerHTML = '<option value="">跳到章節…</option>';
  const frag = document.createDocumentFragment();
  let sn = 0;
  for (const b of S.model.blocks) {
    if (b.kind === "head") {
      if (!isSection(b.text) || b.text.length > 40) continue;
      const id = "s" + (sn++);
      const d = document.createElement("div");
      d.className = "sec"; d.id = id; d.textContent = b.text;
      frag.appendChild(d);
      const o = document.createElement("option"); o.value = id; o.textContent = b.text;
      jump.appendChild(o);
      continue;
    }
    frag.appendChild(card(b));
  }
  app.appendChild(frag);
  refreshCount();
  growAll();
}
function card(b) {
  const c = document.createElement("div");
  c.className = "card";
  c.dataset.txt = b.text;
  const q = document.createElement("div");
  q.className = "q";
  q.textContent = b.text.replace(/\s{3,}/g, "  ");
  c.appendChild(q);
  const cbs = b.items.filter(i => i.type === "cb");
  const txs = b.items.filter(i => i.type === "txt");
  if (cbs.length) {
    const wrap = document.createElement("div"); wrap.className = "chips";
    cbs.forEach(f => {
      const el = document.createElement("div");
      el.className = "chip" + (S.values[f.idx] ? " on" : "");
      el.innerHTML = '<span class="bx">□</span>';
      el.appendChild(document.createTextNode(f.label));
      el.onclick = () => { S.values[f.idx] = !S.values[f.idx];
        if (!S.values[f.idx]) delete S.values[f.idx];
        el.classList.toggle("on"); el.querySelector(".bx").textContent = S.values[f.idx] ? "■" : "□";
        save(); };
      el.querySelector(".bx").textContent = S.values[f.idx] ? "■" : "□";
      wrap.appendChild(el);
    });
    c.appendChild(wrap);
  }
  txs.forEach(f => {
    const lab = document.createElement("div");
    lab.className = "flab"; lab.textContent = f.label;
    // 題目本身已經寫了這個欄位名稱就不重覆顯示（單欄位的卡片最常見）
    if (txs.length === 1 && b.text.includes(f.label)) lab.hidden = true;
    const inp = document.createElement("textarea");
    inp.className = "fld" + (S.values[f.idx] ? " filled" : "");
    inp.rows = 1; inp.value = S.values[f.idx] || "";
    inp.placeholder = "填寫…";
    inp.oninput = () => { const v = inp.value;
      if (v) S.values[f.idx] = v; else delete S.values[f.idx];
      inp.classList.toggle("filled", !!v); grow(inp); save(); };
    c.appendChild(lab); c.appendChild(inp);
  });
  return c;
}
function grow(el) {
  if (el.clientWidth < 60) return;          // 版面還沒算好就別量
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight + 2, 260) + "px";
}
function growAll() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll(".fld").forEach(grow);
  }));
}
function refreshCount() {
  const cb = S.model.fields.filter(f => f.type === "cb").length;
  const tx = S.model.fields.filter(f => f.type === "txt").length;
  const on = S.model.fields.filter(f => f.type === "cb" && S.values[f.idx]).length;
  const fi = S.model.fields.filter(f => f.type === "txt" && S.values[f.idx]).length;
  $("count").textContent = `${on}/${cb} 勾　${fi}/${tx} 填`;
}
let saveT = null;
function save() {
  refreshCount();
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(S.key, JSON.stringify(S.values));
          $("status").textContent = "草稿已自動儲存 " + new Date().toLocaleTimeString("zh-TW", {hour:"2-digit",minute:"2-digit"});
    } catch (e) { $("status").textContent = "⚠️ 草稿存不進去（瀏覽器空間不足）"; }
  }, 400);
}

$("jump").onchange = e => { const el = document.getElementById(e.target.value);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); e.target.value = ""; };
$("search").oninput = e => {
  const q = e.target.value.trim();
  document.querySelectorAll(".card").forEach(c => {
    c.hidden = !!q && !c.dataset.txt.includes(q);
  });
  document.querySelectorAll(".sec").forEach(s => { s.hidden = !!q; });
};
$("reset").onclick = () => {
  if (!confirm("清空這份的所有勾選與填寫？（文件本身不會變）")) return;
  S.values = {}; try { localStorage.removeItem(S.key); } catch (e) {}
  render(); toast("已清空");
};

/* ── 匯出 ─────────────────────────────────────────────────── */
$("export").onclick = async () => {
  const btn = $("export"); btn.disabled = true; btn.textContent = "產生中…";
  try {
    S.model.fields.forEach(f => {
      const v = S.values[f.idx];
      if (f.type === "cb") setCheckbox(f, !!v);
      else if (v) setText(f, v);
    });
    const xml = new XMLSerializer().serializeToString(S.xmlDoc);
    const bytes = new TextEncoder().encode(xml);
    const packed = await deflateRaw(bytes);
    const out = S.entries.map(e => e.name === "word/document.xml"
      ? { ...e, method: packed ? 8 : 0, crc: crc32(bytes),
          usize: bytes.length, raw: packed || bytes }
      : e);
    const blob = await writeZip(out);
    const name = S.fname.replace(/\.docx$/i, "") + "_已填寫.docx";
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); toast("已匯出"); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
    toast("已匯出：" + name);
  } catch (err) { toast("匯出失敗：" + (err.message || err), true); }
  finally { btn.disabled = false; btn.textContent = "匯出 Word"; }
};

/* 離線用：把整包存進瀏覽器快取，之後沒網路也打得開（本機開檔時不註冊） */
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(() => {});

/* 開發測試用：?demo=檔名.docx 直接載入同資料夾的檔 */
(async () => {
  const d = new URLSearchParams(location.search).get("demo");
  if (!d) return;
  try { const r = await fetch(d); const b = await r.blob();
        await load(new File([b], d.split("/").pop(), { type: b.type })); }
  catch (e) { toast("demo 載入失敗：" + e.message, true); }
})();
</script>
