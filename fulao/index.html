<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-APe+IIekj1APw5mhDAUSvurDYqxWRjff0P7cuXfsUv0='; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>扶老圖片工具</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{--orange:#D65A31;--gold:#E6AF2E;--brown:#4B3621;--cream:#FAF6F0;--bg:#fff;--fg:#1c1917;--muted:#78716c;--line:#e7e5e4;--card:#fff;--chip:#f5f5f4;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#fafaf9;--muted:#a8a29e;--line:#44403c;--card:#292524;--chip:#3a3532;--cream:#292524;--bad:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.view{max-width:640px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .title{font-size:19px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:none;color:var(--orange);font-size:16px;padding:8px 4px;white-space:nowrap}
.sub{color:var(--muted);font-size:13.5px;margin:4px 0 10px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px 14px;font-size:15px;line-height:1.3}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.btn.wide{display:block;width:100%;margin:8px 0;text-align:center}
.btn.sm{padding:7px 10px;font-size:13.5px}
.btn.danger{color:var(--bad)}
.box{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;background:var(--card)}
.box .t{font-weight:600}.box .s{color:var(--muted);font-size:13px}
label{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 3px}
input[type=text],input[type=date]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.pg{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;position:relative}
.pg canvas{display:block;width:100%;height:auto;background:#fff}
.pg .n{position:absolute;left:6px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:8px;padding:0 7px}
.pg .ops{display:flex;gap:4px;padding:5px;background:var(--card)}
.pg .ops button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:12.5px;padding:5px 0;color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;background:var(--brown);color:#fff;padding:11px 17px;border-radius:11px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:.97}.toast.err{background:#991b1b}
.warn{border:1px solid var(--gold);background:var(--cream);border-radius:11px;padding:10px 12px;font-size:14px;line-height:1.55;margin:8px 0}
#ed:not([hidden]) ~ .toast{bottom:auto;top:calc(104px + env(safe-area-inset-top))}   /* 編輯畫面開著時，提示改顯示在上面，不要蓋住下面的工具鈕 */
/* ── 編輯畫面（照片頁與平面圖共用） ── */
#ed{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:40;background:#111;display:flex;flex-direction:column;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#ed input{-webkit-user-select:text;user-select:text}
.ed-top{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:#1c1917;color:#fff}
.ed-top button{border:0;background:#3a3532;color:#fff;border-radius:9px;padding:8px 13px;font-size:15px}
.ed-top button.pri{background:var(--orange);font-weight:600}
.ed-top .sp{flex:1}
.ed-hint{padding:0 12px 6px;background:#1c1917;font-size:12.5px;color:#d6d3d1;line-height:1.35;min-height:40px}
.ed-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden}
.ed-stage canvas{max-width:100%;max-height:100%;background:#fff;touch-action:none}
.ed-stage.zoom{display:block;overflow:auto}
.ed-stage.zoom canvas{max-width:none;max-height:none;display:block;margin:0 auto}
.ed-ask{display:flex;gap:6px;padding:8px 10px;background:#292524}
.ed-ask input{flex:1;min-width:0;border:0;border-radius:9px;padding:10px;font-size:16px;color:#111;background:#fff}
.ed-ask button{border:0;border-radius:9px;padding:9px 13px;background:#57534e;color:#fff}
.ed-ask button.pri{background:var(--orange)}
.ed-tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#1c1917}
.ed-tools button{flex:1 0 auto;border:0;background:#3a3532;color:#fff;border-radius:9px;padding:9px 10px;font-size:14px;white-space:nowrap}
.ed-tools button.on{background:var(--gold);color:#111;font-weight:600}
.ed-tools .sep{flex-basis:100%;height:0}
.sheet{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:86%;overflow:auto}
.sheet h3{margin:0 0 8px;font-size:17px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* ── 評估紀錄 ── */
.rec-tab{font-size:17px;font-weight:700;margin:18px 0 2px;color:var(--orange)}
.rec-h{font-weight:600;margin-bottom:8px}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}
.rec-f{display:flex;align-items:center;gap:6px;margin:0;min-width:0;color:var(--fg);font-size:15px;border:1px solid var(--line);border-radius:10px;padding:2px 10px;background:var(--bg)}
.rec-f span{white-space:nowrap}.rec-f .u{color:var(--muted);font-size:13px}
.rec-f input{flex:1 1 0;min-width:0;width:0;border:0;padding:9px 0;background:none;text-align:right;font-size:17px;outline:none}
.rec-in{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:15px;line-height:1.25;text-align:left}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
textarea{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font:inherit;color:inherit;min-height:84px;resize:vertical}
</style>
</head>
<body>
<!-- ══ 首頁：個案清單 ══ -->
<div class="view" id="v-home">
  <div class="top"><div class="title">扶老圖片工具</div><div class="sub" id="ver" style="margin:0"></div></div>
  <p class="sub">照片加扶手線、尺寸、說明，再畫一張平面圖，匯出成圖片上傳；評估的量測與勾選也可以先記在這裡。資料只存在這支手機。</p>
  <p class="warn" id="a2hs" hidden></p>
  <button class="btn pri wide" id="btn-new">＋ 新個案</button>
  <div id="case-list"></div>
  <p class="sub">提醒：把主畫面上這個工具的圖示刪掉，裡面的個案資料也會一起刪掉。</p>
</div>
<!-- ══ 個案：頁面清單 ══ -->
<div class="view" id="v-case" hidden>
  <div class="top"><button class="back" id="case-back">‹ 個案清單</button><div class="title" id="case-title"></div></div>
  <div class="sub" id="case-sub"></div>
  <div style="display:flex;gap:8px">
    <label class="btn" style="flex:1;text-align:center;margin:0;color:var(--fg)">＋ 照片頁<input class="vh" type="file" id="add-photo" accept="image/*" multiple></label>
    <button class="btn" style="flex:1" id="add-plan">＋ 平面圖</button>
  </div>
  <button class="btn wide" id="case-rec"></button>
  <div class="pages" id="pages"></div>
  <button class="btn pri wide" id="share-all">全部匯出（分享圖片）</button>
  <button class="btn wide" id="case-crop"></button>
  <button class="btn wide" id="case-fmt"></button>
  <button class="btn wide" id="case-edit">改個案名稱或日期</button>
  <button class="btn danger wide" id="case-del">刪除這個個案</button>
</div>
<!-- ══ 評估紀錄：照扶老系統的欄位排，只是記錄，不連線 ══ -->
<div class="view" id="v-rec" hidden>
  <div class="top"><button class="back" id="rec-back">‹ 回個案</button><div class="title">評估紀錄</div><div class="sub" id="rec-state" style="margin:0"></div></div>
  <p class="sub">扶老系統要填的那幾格，照它畫面上的順序排。現場先點選、打字記在這裡，回頭再照著填進系統。只存在這支手機。</p>
  <div id="rec-body"></div>
  <button class="btn pri wide" id="rec-copy">把紀錄複製成文字（不含姓名）</button>
</div>
<!-- ══ 編輯畫面 ══ -->
<div id="ed" hidden>
  <div class="ed-top"><button id="ed-cancel">返回</button><span class="sp"></span><button id="ed-zoom">放大</button><button id="ed-undo">復原</button><button class="pri" id="ed-done">完成</button></div>
  <div class="ed-hint" id="ed-hint"></div>
  <div class="ed-ask" id="ed-ask" hidden><input id="ed-input" type="text" autocomplete="off"><button class="pri" id="ed-ok">確定</button><button id="ed-no">取消</button></div>
  <div class="ed-stage" id="ed-stage"><canvas id="ed-cv"></canvas></div>
  <div class="ed-tools" id="ed-tools"></div>
</div>
<div class="sheet" id="sheet" hidden><div class="in" id="sheet-in"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   扶老圖片工具 v1
   做什麼用：扶老的案子以前用 Keynote 修圖、畫平面圖再匯出上傳。這個工具讓你在手機上邊評估邊完成：
             照片頁（16:9 白底，一到兩張照片，紅色扶手線、黃色尺寸箭頭、黃底說明框、黑色箭頭）與
             平面圖（房間方框、牆、門弧、馬桶／洗手台／浴缸等符號），匯出成圖片從手機分享出去。
   資料：只存在這支手機（IndexedDB），不上傳到任何地方；沒有連網功能。
   ══════════════════════════════════════════════════════════ */
const VERSION = "v4";
const $ = id => document.getElementById(id);
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
let toastT = null;
function toast(msg, bad, ms) { const el = $("toast"); el.textContent = msg; el.className = "toast show" + (bad ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(() => el.className = "toast", ms || (bad ? 4200 : 2400)); }
const LOCAL = location.hostname === "127.0.0.1" || location.hostname === "localhost";   // 只有開發測試時為真
const pad2 = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
const safeName = s => String(s || "").replace(/[\/\\:*?"<>|\u0000-\u001f]/g, "_").trim();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));
const FONT = "'Helvetica Neue','PingFang TC',-apple-system,sans-serif";      // 跟負責人 Keynote 的預設字體一樣：英數 Helvetica Neue、中文蘋方

/* ── 手機本機資料庫 ── */
const DB = {
  db: null, opening: null,
  open() { if (DB.opening) return DB.opening;       // 正在連線中就共用同一次，不要同時開好幾條
    DB.opening = DB.open0().finally(() => { DB.opening = null; }); return DB.opening; },
  open0() { return new Promise((res, rej) => { const r = indexedDB.open("fulao1", 1), tm = setTimeout(() => rej(new Error("手機的資料庫沒有回應")), 5000);       // 開了卻一直沒回應：5 秒就放棄，不讓後面所有動作跟著卡住
    r.onupgradeneeded = () => { for (const s of ["cases", "pages", "blobs"]) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); };
    r.onsuccess = () => { clearTimeout(tm); const db = r.result; DB.db = db; db.onclose = () => { if (DB.db === db) DB.db = null; };
      db.onversionchange = () => { try { db.close(); } catch (e) {} if (DB.db === db) DB.db = null; }; res(); };
    r.onerror = () => { clearTimeout(tm); rej(r.error || new Error("資料庫打不開")); }; r.onblocked = () => { clearTimeout(tm); rej(new Error("資料庫被另一個視窗佔住")); }; }); },
  /* 開一筆交易來做事。資料庫的連線有時會自己斷掉（例如 iPhone 從背景回來）：交易開不起來就重新連線、再試一次。
     body(t, res, rej)：在這筆交易裡做事，做完自己叫 res／rej（交易一開就要馬上用，中間不能等別的事） */
  run(stores, mode, body) {
    const go = () => new Promise((res, rej) => { let t; try { t = DB.db.transaction(stores, mode); } catch (e) { DB.drop(); return rej(e); } body(t, res, rej); });
    // 連線斷掉的幾種樣子：連線已經被丟掉、交易開不起來、或交易開了才報「連線中斷」（iPhone 從背景回來時會遇到）。失敗的交易什麼都沒寫進去，所以重做一次是安全的
    const lost = e => !DB.db || /^(UnknownError|InvalidStateError|TransactionInactiveError)$/.test((e && e.name) || "");
    return (DB.db ? go() : DB.open().then(go)).catch(e => { if (!lost(e)) throw e; DB.drop(); return DB.open().then(go); });
  },
  drop() { const d = DB.db; DB.db = null; try { if (d) d.close(); } catch (e) {} },       // 把壞掉的連線丟掉，下次要用時重開
  why: (t, ev, msg) => t.error || (ev && ev.target && ev.target.error) || new Error(msg),       // 失敗的原因：交易的，沒有就拿那一筆請求的
  tx(store, mode, fn) { return DB.run(store, mode, (t, res, rej) => { let out;
    t.oncomplete = () => res(out); t.onerror = t.onabort = ev => rej(DB.why(t, ev, "沒存成功"));
    const rq = fn(t.objectStore(store)); if (rq) rq.onsuccess = () => { out = rq.result; }; }); },
  get: (s, k) => DB.tx(s, "readonly", o => o.get(k)),
  put: (s, k, v) => DB.tx(s, "readwrite", o => o.put(v, k)),
  del: (s, k) => DB.tx(s, "readwrite", o => o.delete(k)),
  all: s => DB.tx(s, "readonly", o => o.getAll()),
  /* 改個案：讀最新的那一筆 → 改 → 連同頁面與照片寫回，全部在「同一筆交易」裡——全部成功才算數；另一個分頁同時在改也不會互相蓋掉。
     fn(c, t)：直接改 c；要一起寫或刪的頁面、照片，用 t.objectStore(...) 在這同一筆交易裡做（不能在裡面等別的事，交易會自己結束） */
  mutate(cid, fn) { return DB.run(["cases", "pages", "blobs"], "readwrite", (t, res, rej) => { let out = null, err = null;
    t.oncomplete = () => res(out); t.onerror = t.onabort = ev => rej(err || DB.why(t, ev, "沒存成功"));
    const rq = t.objectStore("cases").get(cid);
    rq.onsuccess = () => { try { const c = rq.result; if (!c) throw new Error("找不到這個個案"); fn(c, t); c.at = Date.now(); t.objectStore("cases").put(c, cid); out = c; } catch (e) { err = e; try { t.abort(); } catch (x) {} } }; }); },
  /* 刪掉整個個案：個案、它的每一頁、每一頁的照片，同一筆交易 */
  dropCase(cid) { return DB.run(["cases", "pages", "blobs"], "readwrite", (t, res, rej) => { const pages = t.objectStore("pages"), blobs = t.objectStore("blobs");
    t.oncomplete = () => res(); t.onerror = t.onabort = ev => rej(DB.why(t, ev, "沒刪成功"));
    const rq = t.objectStore("cases").get(cid);
    rq.onsuccess = () => { for (const pid of (rq.result && rq.result.pages) || []) { const r2 = pages.get(pid); r2.onsuccess = () => { for (const k of (r2.result && r2.result.photos) || []) blobs.delete(k); pages.delete(pid); }; }
      t.objectStore("cases").delete(cid); }; }); },
  /* 存一頁：這一頁還在、而且從我讀出來之後沒有被別的視窗改過，才寫。每寫一次版本號（v）加一。
     回傳新的版本號（數字）；"gone"＝已經被刪掉，不寫回去；"conflict"＝別的視窗改過了，不蓋掉它（force 為真才蓋） */
  savePage(pg, base, force) { return DB.run("pages", "readwrite", (t, res, rej) => { let out = "gone"; const o = t.objectStore("pages");
    t.oncomplete = () => res(out); t.onerror = t.onabort = ev => rej(DB.why(t, ev, "沒存成功"));
    const rq = o.get(pg.id); rq.onsuccess = () => { const cur = rq.result; if (!cur) return; if (!force && (cur.v || 0) !== base) { out = "conflict"; return; } pg.v = (cur.v || 0) + 1; o.put(pg, pg.id); out = pg.v; }; }); },
};

/* ── 分享／存檔 ── */
function download(f) { const u = URL.createObjectURL(f), a = mk("a"); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
function closeSheet() { $("sheet").hidden = true; $("sheet-in").textContent = ""; }
async function offerShare(list) {                // list: [{name, bytes, type}]
  if (LOCAL && window.__afTestSink) { await window.__afTestSink(list); return true; }
  const files = list.map(f => new File([f.bytes], f.name, { type: f.type }));
  const can = fs => navigator.canShare && navigator.canShare({ files: fs });
  // iPhone 規定「分享」要緊接在你按的那一下後面；圖片要先花時間畫，所以一律備好之後再請你按一次
  const box = $("sheet-in"); box.textContent = "";
  box.appendChild(mk("h3", "", "圖片備好了（" + files.length + " 張）"));
  box.appendChild(mk("p", "sub", "最大的一張 " + (Math.max(...files.map(f => f.size)) / 1e6).toFixed(1) + "MB（每張都壓在 3MB 以內）"));
  if (can(files)) { const b = mk("button", "btn pri wide", files.length > 1 ? "一次分享 " + files.length + " 張" : "分享／存到照片");
    b.onclick = async () => { try { await navigator.share({ files }); closeSheet(); } catch (e) {} }; box.appendChild(b); }
  if (files.length > 1 || !can(files)) for (const f of files) { const b = mk("button", "btn wide", (can([f]) ? "只分享：" : "下載：") + f.name); b.style.whiteSpace = "normal";
    b.onclick = async () => { if (can([f])) { try { await navigator.share({ files: [f] }); } catch (e) {} } else download(f); }; box.appendChild(b); }
  const c = mk("button", "btn wide", "關閉"); c.onclick = closeSheet; box.appendChild(c);
  $("sheet").hidden = false; return true;
}

/* ── 照片：縮到長邊 1600、轉正、存成 JPEG ── */
function shrinkPhoto(file) {
  return new Promise((res, rej) => { const im = new Image(), u = URL.createObjectURL(file);
    const fail = e => { URL.revokeObjectURL(u); rej(e instanceof Error ? e : new Error("這張照片讀不了")); };
    im.onerror = () => fail();
    im.onload = () => { try { const W = im.naturalWidth, H = im.naturalHeight, k = Math.min(1, 1600 / Math.max(W, H)); if (!(W > 0) || !(H > 0)) return fail();

function planDown(p) { const hit = planHit(p), same = !!hit && !!ED.sel && hit.kind === ED.sel.kind && hit.i === ED.sel.i;

    if (d.same && d.hit.kind === "door") { edPush(); const dr = pl.doors[d.hit.i]; dr.v = (dr.v + 1) % 5; edSave(); }

function planDoor(p, wi) {                        // 在這面牆上、點的位置開一扇門（寬 2 格；牆太短就縮成 1 格）

/* ── 手指事件：一次只認一根手指在畫；第二根手指放上來＝這一筆不算（放大時兩根手指一起拖是移動畫面） ── */

  if (edPos.size > 1) return edCancelGesture();
  const p = edPt(e); ED.pid = e.pointerId; ED.page.type === "photo" ? photoDown(p) : planDown(p); if (ED.drag) ED.drag.s0 = ED.seq;

edCv.addEventListener("pointermove", e => {
  const q = edPos.get(e.pointerId);
  if (q && edPos.size > 1 && ED.zoom > 1) { const st = $("ed-stage"); st.scrollLeft -= (e.clientX - q.x) / 2; st.scrollTop -= (e.clientY - q.y) / 2; }
  if (q) { q.x = e.clientX; q.y = e.clientY; }
  if (!ED.drag || e.pointerId !== ED.pid || edPos.size > 1) return;
  e.preventDefault(); const p = edPt(e); ED.page.type === "photo" ? photoMove(p) : planMove(p);
});
edCv.addEventListener("pointerup", e => { edPos.delete(e.pointerId); if (!ED.drag || e.pointerId !== ED.pid) return; ED.pid = null; const p = edPt(e); ED.page.type === "photo" ? photoUp(p) : planUp(p); });
edCv.addEventListener("pointercancel", e => { edPos.delete(e.pointerId); if (e.pointerId === ED.pid) edCancelGesture(); });
async function openEditor(pid) {                  // 一律在排隊裡呼叫（清單鎖住的時候）：見 editPage
  if (ED.opening || ED.page) return; ED.opening = true;
  try { const p = await DB.get("pages", pid), c = C ? await DB.get("cases", C.id) : null;
    if (!p || !c || !c.pages.includes(pid)) { toast("這一頁已經不在這個個案裡了", true); if (C) openCase(C.id); return; }
    const imgs = p.type === "photo" ? await pageImgs(p, true) : [];
    edPos.clear(); Object.assign(ED, { page: p, imgs, sel: null, drag: null, pid: null, hist: [], seq: 0, rev: 0, savedRev: 0, base: p.v || 0, conflict: false, fail: 0, closeFail: 0, savedJson: JSON.stringify(edStrip(p)), asking: null, zoom: 1, busy: false, tool: p.type === "photo" ? "rail" : "room" });

      ED.view = { x: Math.max(0, x0 - 20), y: 0, w: Math.min(PW, x1 + 20) - Math.max(0, x0 - 20), h: PH }; }          // 編輯時只看照片那一塊（兩邊的白邊不顯示），手機上才夠大
    $("ed-ask").hidden = true; $("ed").hidden = false; edFit(); edTools(); edDraw(); markAt({ c: c.id, p: pid });

}
async function closeEditor() {                    // 存好了才關；沒存成功就留在編輯畫面，畫的東西還在，可以再按一次
  if (ED.busy || !ED.page) return; edCancelGesture(); ED.busy = true; let r = "ok";
  try { r = await edFlush();
    if (r === "conflict") { if (!confirm("這一頁在另一個視窗被改過了。\n按「確定」＝用這邊的內容蓋過去\n按「取消」＝先留在這裡")) { ED.busy = false; return; } r = await edFlush(true); }
